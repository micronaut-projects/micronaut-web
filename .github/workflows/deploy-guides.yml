name: Deploy Guides

on:
  repository_dispatch:
    types:
      - guides-updated
  workflow_dispatch:
    inputs:
      guides_repository:
        description: Guides repository to build from
        required: false
        default: micronaut-projects/micronaut-guides
      guides_ref:
        description: Guides branch, tag, or SHA to build from
        required: false
        default: master

permissions:
  contents: write

concurrency:
  group: guides-pages
  cancel-in-progress: false

env:
  TARGET_REPOSITORY: micronaut-projects/micronaut-guides-v2
  TARGET_BRANCH: gh-pages

run-name: Publish guides from ${{ github.event.client_payload.sha || inputs.guides_ref || 'master' }}

jobs:
  publish:
    name: Build and publish guides
    runs-on: ubuntu-latest
    steps:
      - name: Check out Micronaut web
        uses: actions/checkout@v7

      - name: Validate GitHub token
        env:
          HAS_GH_TOKEN: ${{ secrets.GH_TOKEN != '' }}
        run: |
          if [ "$HAS_GH_TOKEN" != "true" ]; then
            echo "::error::Set GH_TOKEN with contents:write access to $TARGET_REPOSITORY."
            exit 1
          fi

      - name: Check out guides Pages repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_BRANCH }}
          path: published-guides
          token: ${{ secrets.GH_TOKEN }}

      - name: Check out guides project
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.guides_repository || 'micronaut-projects/micronaut-guides' }}
          ref: ${{ github.event.client_payload.sha || inputs.guides_ref || 'master' }}
          path: external/micronaut-guides

      - name: Resolve guides revision
        id: guides
        working-directory: external/micronaut-guides
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-guides-${{ hashFiles('external/micronaut-guides/**/*.gradle') }}
          restore-keys: gradle-guides-

      # Micronaut Starter generates one sample project per guide option under
      # `build/code`, which is both the `sourcedir` every guide include
      # resolves against and the input to the downloadable archives in
      # `build/dist`.
      #
      # `--no-build-cache` because the generation tasks do not declare the
      # Java version as an input, so an entry cached under one version is a
      # valid cache hit under another. Gradle writes the archives
      # reproducibly, so a guide that did not change re-zips to the same bytes
      # and adds nothing to the published branch.
      - name: Generate guide sample projects and archives
        working-directory: external/micronaut-guides
        env:
          BUILD_JDK: "25"
        run: |
          set -euo pipefail
          ./gradlew --no-build-cache generateCodeZip

          # `JDK_VERSION` picks both the Java version stamped into the
          # generated build files and the threshold that skips a guide whose
          # metadata caps the JDK below it, so a capped guide produces neither
          # sources nor an archive in the pass above. Rebuild each one at its
          # own maximum; the generation task has to be forced because the
          # Java version is not one of its inputs.
          for metadata in guides/*/metadata.json; do
            maximum="$(jq -r '.maximumJavaVersion // empty' "$metadata")"
            if [ -z "$maximum" ] || [ "$maximum" -ge "$BUILD_JDK" ]; then
              continue
            fi
            if [ "$(jq -r '.publish' "$metadata")" = "false" ]; then
              continue
            fi
            slug="$(basename "$(dirname "$metadata")")"
            task="$(echo "$slug" | awk -F- '{ name = $1; for (i = 2; i <= NF; i++) name = name toupper(substr($i, 1, 1)) substr($i, 2); print name }')"
            echo "Rebuilding $slug at Java $maximum."
            JDK_VERSION="$maximum" ./gradlew --no-build-cache "${task}GenerateProjects" --rerun
            JDK_VERSION="$maximum" ./gradlew --no-build-cache "${task}GenerateZips"
          done

      - name: Configure guides deployment
        env:
          CONFIGURED_GITHUB_PAGES_ORIGIN: ${{ vars.MICRONAUT_GITHUB_PAGES_ORIGIN || vars.DEFAULT_GITHUB_PAGES_ORIGIN }}
          # Cross-surface links must use the production custom domains: the
          # GitHub Pages project URLs 301 to them without CORS headers, which
          # kills browser fetches such as the search-index and manifest loads.
          CONFIGURED_MAIN_SITE_URL: ${{ vars.MICRONAUT_MAIN_SITE_URL || 'https://micronaut.io/' }}
          CONFIGURED_DOCS_SITE_URL: ${{ vars.MICRONAUT_DOCS_SITE_URL || 'https://docs.micronaut.io/' }}
          CONFIGURED_GUIDES_SITE_URL: ${{ vars.MICRONAUT_GUIDES_SITE_URL }}
          CONFIGURED_CUSTOM_DOMAIN: ${{ vars.MICRONAUT_GUIDES_CUSTOM_DOMAIN }}
          CONFIGURED_SURFACE_BASE: ${{ vars.MICRONAUT_GUIDES_BASE }}
          PUBLISHED_DIRECTORY: published-guides
        run: node scripts/configure-pages-deployment.ts --surface guides --target-repository "$TARGET_REPOSITORY" --published-dir "$PUBLISHED_DIRECTORY"

      - name: Build guides surface
        env:
          MICRONAUT_DEPLOY_SURFACE: guides
          MICRONAUT_GUIDES_ROOT: /
          MICRONAUT_GUIDES_LATEST_ROOT: /
          MICRONAUT_GUIDES_DIR: ${{ github.workspace }}/external/micronaut-guides
          GUIDES_RENDER_ALL: "true"
          GUIDES_RENDER_STRICT: "true"
        run: npm run build:guides

      # Every option page links its own archive, and the build writes a
      # redirect stub in its place; a stub that survives this copy is a
      # download that breaks the moment this site owns guides.micronaut.io,
      # where those stubs point.
      - name: Attach guide sample project archives
        run: |
          set -euo pipefail
          cp external/micronaut-guides/build/dist/*.zip dist/
          unreplaced=""
          for archive in dist/*.zip; do
            [ "$(head -c 2 "$archive")" = "PK" ] || unreplaced="$unreplaced $archive"
          done
          if [ -n "$unreplaced" ]; then
            echo "::error::The guides build generated no archive for:$unreplaced"
            exit 1
          fi

      - name: Replace guides Pages artifact
        env:
          GUIDES_SHA: ${{ steps.guides.outputs.sha }}
        run: |
          # Pinned release-line trees (5.0.x, 5.1.x, ...) are snapshots the
          # legacy host published per Micronaut version and cannot be rebuilt
          # from current guide sources, so this replace leaves them alone
          # instead of deleting URLs it has no way to regenerate.
          find published-guides -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name '[0-9]*.[0-9]*.x' -exec rm -rf {} +
          cp -R dist/. published-guides/
          # Records the built revision so the upstream poller sees that master
          # moved even when the rendered output is byte-identical.
          echo "$GUIDES_SHA" > published-guides/.guides-revision

      - name: Commit and push guides Pages branch
        working-directory: published-guides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Publish Micronaut guides from ${{ steps.guides.outputs.sha }}"
            git push origin HEAD:${{ env.TARGET_BRANCH }}
          else
            echo "Guides Pages branch is already up to date."
          fi
